name: TravelMemory Windows Checks
on:
  pull_request:
    paths:
      - 'apps/TravelMemory/**'
      - '.github/workflows/travelmemory-check.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: travelmemory-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install PySide6==6.8.0 tzdata
      - name: Python syntax and repository/UI regression
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m compileall -q apps/TravelMemory/App
          python -B -m unittest discover -s apps/TravelMemory/tests -v
      - name: Viewport regression
        run: node apps/TravelMemory/tests/map_viewport.test.cjs
