name: ScratchGame Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/ScratchGame/src/**'
      - 'apps/ScratchGame/tools/**'
      - 'apps/ScratchGame/VERSION'
      - 'apps/ScratchGame/BUILD'
      - '.github/workflows/scratchgame-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scratchgame-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        id: version
        run: |
          $version = (Get-Content 'apps/ScratchGame/VERSION' -Raw).Trim()
          $build = (Get-Content 'apps/ScratchGame/BUILD' -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          if ($build -eq '0') {
            "display=V$version" >> $env:GITHUB_OUTPUT
          } else {
            "display=V$version Build $build" >> $env:GITHUB_OUTPUT
          }

      - name: Restore Windows x64 runtime packs
        run: >-
          dotnet restore 'apps/ScratchGame/src/ScratchGame/ScratchGame.csproj'
          -r win-x64

      - name: Build
        run: >-
          dotnet build 'apps/ScratchGame/src/ScratchGame/ScratchGame.csproj'
          -c Release -r win-x64 --no-restore
          /p:Version=${{ steps.version.outputs.version }}

      - name: Publish Windows x64 executable
        run: >-
          dotnet publish 'apps/ScratchGame/src/ScratchGame/ScratchGame.csproj'
          -c Release -r win-x64 --self-contained true --no-restore
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          /p:EnableCompressionInSingleFile=true
          /p:DebugType=None
          /p:DebugSymbols=false
          /p:Version=${{ steps.version.outputs.version }}
          -o 'apps/ScratchGame/dist'

      - name: Verify Windows output and shell icon
        run: |
          $exe = (Resolve-Path 'apps/ScratchGame/dist/ScratchGame.exe').Path
          if (-not (Test-Path $exe)) {
            Write-Error 'ScratchGame.exe was not produced.'
            exit 1
          }

          $looseDlls = @(Get-ChildItem 'apps/ScratchGame/dist' -File -Filter '*.dll')
          if ($looseDlls.Count -gt 0) {
            Write-Error "Unexpected loose DLLs: $($looseDlls.Name -join ', ')"
            exit 1
          }

          Add-Type -AssemblyName System.Drawing
          $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($exe)
          if ($null -eq $icon) {
            Write-Error 'Windows could not resolve an associated application icon from ScratchGame.exe.'
            exit 1
          }
          try {
            Write-Host "Windows associated icon resolved: $($icon.Width)x$($icon.Height)"
            if ($icon.Width -lt 16 -or $icon.Height -lt 16) {
              Write-Error 'Resolved Windows application icon is invalid.'
              exit 1
            }
          }
          finally {
            $icon.Dispose()
          }

      - name: Smoke launch published executable
        run: |
          $exe = (Resolve-Path 'apps/ScratchGame/dist/ScratchGame.exe').Path
          $smokeLocalAppData = Join-Path $env:RUNNER_TEMP 'ScratchGameSmokeLocalAppData'
          New-Item -ItemType Directory -Force -Path $smokeLocalAppData | Out-Null
          $previousLocalAppData = $env:LOCALAPPDATA
          $env:LOCALAPPDATA = $smokeLocalAppData

          try {
            $process = Start-Process -FilePath $exe -PassThru
            $deadline = [DateTime]::UtcNow.AddSeconds(8)
            while ([DateTime]::UtcNow -lt $deadline) {
              Start-Sleep -Milliseconds 500
              $process.Refresh()
              if ($process.HasExited) {
                Write-Error "ScratchGame.exe exited during startup smoke test. Exit code: $($process.ExitCode)"
                exit 1
              }
            }

            Write-Host "ScratchGame.exe remained running for startup smoke test (PID $($process.Id))."
          }
          finally {
            if ($null -ne $process) {
              $process.Refresh()
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              }
              $process.Dispose()
            }
            $env:LOCALAPPDATA = $previousLocalAppData
          }

      # Runtime art/audio/ticket resources are intentionally external and are not kept
      # as repository binaries. This artifact is therefore named EXE-only on purpose.
      - name: Upload executable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ScratchGame-${{ steps.version.outputs.display }}-exe-only-win-x64
          path: apps/ScratchGame/dist/ScratchGame.exe
          retention-days: 14
