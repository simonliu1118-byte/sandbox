name: Scrapling Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/ScraplingProbe/**'
      - '.github/workflows/scrapling-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrapling-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  one-listing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Scrapling and browser
        run: |
          python -m pip install --disable-pip-version-check -r apps/ScraplingProbe/requirements.txt
          python -m patchright install chromium

      - name: Unit tests
        run: python -m unittest discover -s apps/ScraplingProbe -p 'test_*.py' -v

      - name: One public product page probe (no retries)
        run: |
          python apps/ScraplingProbe/scrapling_probe.py --output apps/ScraplingProbe/probe-result.json

      - name: Upload JSON result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scrapling-probe-v0.1.0
          path: apps/ScraplingProbe/probe-result.json
          if-no-files-found: warn
          retention-days: 3
