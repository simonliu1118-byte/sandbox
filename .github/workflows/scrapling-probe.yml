name: Scrapling Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/ScraplingProbe/**'
      - '.github/workflows/scrapling-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrapling-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  one-listing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r apps/ScraplingProbe/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s apps/ScraplingProbe -p 'test_*.py' -v

      - name: One-off broad momo keyword and HTML prototype report
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        run: |
          python apps/ScraplingProbe/momo_search_data.py --keyword '咖啡' --limit 20 --output apps/ScraplingProbe/momo-broad-result.json --html apps/ScraplingProbe/momo-price-report.html

      - name: Upload real momo price comparison page
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        uses: actions/upload-artifact@v4
        with:
          name: momo-keyword-web-prototype-build3
          path: |
            apps/ScraplingProbe/momo-broad-result.json
            apps/ScraplingProbe/momo-price-report.html
          if-no-files-found: warn
          retention-days: 3
