name: Scrapling Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/ScraplingProbe/**'
      - '.github/workflows/scrapling-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrapling-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  one-listing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r apps/ScraplingProbe/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s apps/ScraplingProbe -p 'test_*.py' -v
      
      - name: One-off momo keyword search observation
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        run: |
          python apps/ScraplingProbe/keyword_search.py --keyword '羅技 M331' --live-momo --limit 20 --output apps/ScraplingProbe/keyword-search-check.json --html apps/ScraplingProbe/keyword-search-report.html

      - name: Upload keyword search diagnostic
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        uses: actions/upload-artifact@v4
        with:
          name: keyword-prototype-v0.3.0
          path: |
            apps/ScraplingProbe/keyword-search-check.json
            apps/ScraplingProbe/keyword-search-report.html
          if-no-files-found: warn
          retention-days: 3
