name: Scrapling Probe

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/ScraplingProbe/**'
      - '.github/workflows/scrapling-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scrapling-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  one-listing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install project dependencies
        run: python -m pip install --disable-pip-version-check -r apps/ScraplingProbe/requirements.txt

      - name: Unit tests
        run: python -m unittest discover -s apps/ScraplingProbe -p 'test_*.py' -v

      - name: Install standalone site dependencies
        run: python -m pip install --disable-pip-version-check -r apps/ScraplingProbe/site/requirements.txt

      - name: One-page preview route and password tests
        working-directory: apps/ScraplingProbe/site
        run: python -m unittest discover -s tests -p 'test_*.py' -v


      - name: One-off 3m 1530 price count diagnostic
        if: github.event_name == 'pull_request' && github.event.action == 'synchronize'
        working-directory: apps/ScraplingProbe/site
        run: |
          python -c "from app import fetch_once; x=fetch_once('3m 1530',1); print({'status':x['status'],'raw_count':x.get('raw_count'),'retained_count':len(x['results']),'fully_matching':sum(r.get('relevance')==3 for r in x['results'])})"
