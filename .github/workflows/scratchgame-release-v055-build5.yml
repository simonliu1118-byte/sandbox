name: ScratchGame Release V0.5.5 Build 5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[release-retry ScratchGame V0.5.5 Build 5]') ||
      contains(github.event.head_commit.message, '[release-recover ScratchGame V0.5.5 Build 5]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TAG: ScratchGame-v0.5.5-build5
      RELEASE_TITLE: ScratchGame V0.5.5 Build 5
      TARGET_SHA: '0926e2c69c500340d38f33f09f390e0e7ce24b63'
      STALLED_RUN_ID: '35272957266'
      ACCEPTANCE_RUN_ID: '35271132305'
      ACCEPTANCE_HEAD_SHA: '556aaa1152ed5939bd15b67aa581cf8d1029c2a9'
      ARTIFACT_ID: '10519115830'
      ARTIFACT_ARCHIVE: ScratchGame-V0.5.5-Build5-portable-win-x64.zip
      ARTIFACT_ARCHIVE_SHA256: 4b96f75733e48c23b3e2e0657f683c9ee6eaa7a1dc4a97f1719f561a0f622e3a
      RELEASE_ZIP: ScratchGame-V0.5.5-Build5-win-x64.zip
      RELEASE_ZIP_SHA256: eaef6282150652ab6a726919ba5d89105c8c626559b9c3c549e23b42ef650459
      RELEASE_ZIP_SIZE: '142755863'

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Cancel stale release upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          stalled_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STALLED_RUN_ID}")"
          stalled_status="$(jq -r '.status' <<<"${stalled_json}")"
          if [ "${stalled_status}" = "queued" ] || [ "${stalled_status}" = "in_progress" ]; then
            echo "Cancelling stale release run ${STALLED_RUN_ID} (${stalled_status})."
            gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${STALLED_RUN_ID}/cancel" >/dev/null
            for _ in $(seq 1 30); do
              sleep 2
              stalled_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${STALLED_RUN_ID}" --jq '.status')"
              if [ "${stalled_status}" != "queued" ] && [ "${stalled_status}" != "in_progress" ]; then
                break
              fi
            done
          fi
          echo "Stale release run status: ${stalled_status}"
          test "${stalled_status}" != "queued"
          test "${stalled_status}" != "in_progress"

      - name: Verify version identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < apps/ScratchGame/VERSION)" = "0.5.5"
          test "$(tr -d '\r\n' < apps/ScratchGame/BUILD)" = "5"
          test -f apps/ScratchGame/RELEASE_NOTES_V0.5.5_BUILD5.md

      - name: Lightweight secret-pattern gate
        shell: bash
        run: |
          set -euo pipefail
          if git grep -nE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----)' -- . ':!*.md'; then
            echo "Potential secret-like material detected in tracked non-Markdown files."
            exit 1
          fi

      - name: Verify accepted Windows CI run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ACCEPTANCE_RUN_ID}")"
          test "$(jq -r '.conclusion' <<<"$run_json")" = "success"
          test "$(jq -r '.head_sha' <<<"$run_json")" = "${ACCEPTANCE_HEAD_SHA}"

      - name: Download and verify accepted Portable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "${ARTIFACT_ARCHIVE}"

          echo "${ARTIFACT_ARCHIVE_SHA256}  ${ARTIFACT_ARCHIVE}" | sha256sum -c -

          mkdir -p release-dist
          unzip -q "${ARTIFACT_ARCHIVE}" -d release-dist
          test -f "release-dist/${RELEASE_ZIP}"
          test "$(stat -c '%s' "release-dist/${RELEASE_ZIP}")" = "${RELEASE_ZIP_SIZE}"
          echo "${RELEASE_ZIP_SHA256}  release-dist/${RELEASE_ZIP}" | sha256sum -c -

          unzip -l "release-dist/${RELEASE_ZIP}" | grep -F 'ScratchGame/ScratchGame.exe'
          unzip -l "release-dist/${RELEASE_ZIP}" | grep -F 'ScratchGame/PackEditor.exe'
          unzip -l "release-dist/${RELEASE_ZIP}" | grep -F 'ScratchGame/PACKAGE_CONTENTS.txt'
          unzip -l "release-dist/${RELEASE_ZIP}" | grep -F 'ScratchGame/TestPacks/ThreeStar-Test.scratchpack'

          printf '%s  %s\n' "${RELEASE_ZIP_SHA256}" "${RELEASE_ZIP}" > release-dist/SHA256SUMS.txt

      - name: Recover draft assets and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          releases_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")"
          release_id="$(jq -r --arg tag "${TAG}" '[.[] | select(.tag_name == $tag)][0].id // empty' <<<"${releases_json}")"

          if [ -z "${release_id}" ]; then
            body="$(cat apps/ScratchGame/RELEASE_NOTES_V0.5.5_BUILD5.md)"
            release_json="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" \
              -f tag_name="${TAG}" \
              -f target_commitish="${TARGET_SHA}" \
              -f name="${RELEASE_TITLE}" \
              -f body="${body}" \
              -F draft=true \
              -F prerelease=false)"
            release_id="$(jq -r '.id' <<<"${release_json}")"
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          if [ "$(jq -r '.draft' <<<"${release_json}")" = "false" ]; then
            echo "Release is already published; verifying assets only."
          else
            assets_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100")"
            for asset_id in $(jq -r --arg zip "${RELEASE_ZIP}" '.[] | select(.name == $zip or .name == "SHA256SUMS.txt") | .id' <<<"${assets_json}"); do
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
            done

            upload_asset() {
              local file="$1"
              local content_type="$2"
              local name
              local encoded
              name="$(basename "${file}")"
              encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "${name}")"

              for attempt in 1 2 3; do
                echo "Uploading ${name}, attempt ${attempt}/3"
                if curl --http1.1 --silent --show-error --fail-with-body \
                  --connect-timeout 30 --max-time 1200 \
                  -X POST \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -H "Accept: application/vnd.github+json" \
                  -H "X-GitHub-Api-Version: 2022-11-28" \
                  -H "Content-Type: ${content_type}" \
                  --data-binary "@${file}" \
                  "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?name=${encoded}" \
                  > "upload-${attempt}.json"; then
                  return 0
                fi

                current_assets="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100")"
                completed="$(jq -r --arg n "${name}" '[.[] | select(.name == $n and .state == "uploaded")][0].id // empty' <<<"${current_assets}")"
                if [ -n "${completed}" ]; then
                  echo "${name} is already uploaded after a lost response."
                  return 0
                fi
                for stale_id in $(jq -r --arg n "${name}" '.[] | select(.name == $n) | .id' <<<"${current_assets}"); do
                  gh api --method DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${stale_id}" || true
                done
                sleep 5
              done

              echo "Failed to upload ${name} after 3 attempts."
              return 1
            }

            upload_asset "release-dist/${RELEASE_ZIP}" "application/zip"
            upload_asset "release-dist/SHA256SUMS.txt" "text/plain"
          fi

          assets_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100")"
          zip_state="$(jq -r --arg n "${RELEASE_ZIP}" '[.[] | select(.name == $n)][0].state // empty' <<<"${assets_json}")"
          zip_size="$(jq -r --arg n "${RELEASE_ZIP}" '[.[] | select(.name == $n)][0].size // 0' <<<"${assets_json}")"
          zip_digest="$(jq -r --arg n "${RELEASE_ZIP}" '[.[] | select(.name == $n)][0].digest // empty' <<<"${assets_json}")"
          sums_state="$(jq -r '[.[] | select(.name == "SHA256SUMS.txt")][0].state // empty' <<<"${assets_json}")"

          test "${zip_state}" = "uploaded"
          test "${zip_size}" = "${RELEASE_ZIP_SIZE}"
          if [ -n "${zip_digest}" ] && [ "${zip_digest}" != "null" ]; then
            test "${zip_digest}" = "sha256:${RELEASE_ZIP_SHA256}"
          fi
          test "${sums_state}" = "uploaded"

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}")"
          if [ "$(jq -r '.draft' <<<"${release_json}")" = "true" ]; then
            gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" \
              -f target_commitish="${TARGET_SHA}" \
              -f name="${RELEASE_TITLE}" \
              -F draft=false \
              -F prerelease=false >/dev/null
          fi

          published="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          test "$(jq -r '.draft' <<<"${published}")" = "false"
          test -n "$(jq -r '.published_at // empty' <<<"${published}")"
          echo "Release ${TAG} published successfully."
