name: ScratchGame Release V0.5.5 Build 5

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[release-recover ScratchGame V0.5.5 Build 5]')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TAG: ScratchGame-v0.5.5-build5
      RELEASE_TITLE: ScratchGame V0.5.5 Build 5
      TARGET_SHA: '0926e2c69c500340d38f33f09f390e0e7ce24b63'
      ACCEPTANCE_RUN_ID: '35271132305'
      ACCEPTANCE_HEAD_SHA: '556aaa1152ed5939bd15b67aa581cf8d1029c2a9'
      ARTIFACT_ID: '10519115830'
      ARTIFACT_ARCHIVE: ScratchGame-V0.5.5-Build5-portable-win-x64.zip
      ARTIFACT_ARCHIVE_SHA256: 4b96f75733e48c23b3e2e0657f683c9ee6eaa7a1dc4a97f1719f561a0f622e3a
      RELEASE_ZIP: ScratchGame-V0.5.5-Build5-win-x64.zip
      RELEASE_ZIP_SHA256: eaef6282150652ab6a726919ba5d89105c8c626559b9c3c549e23b42ef650459
      RELEASE_ZIP_SIZE: '142755863'

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4

      - name: Verify release identity and accepted Windows CI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < apps/ScratchGame/VERSION)" = "0.5.5"
          test "$(tr -d '\r\n' < apps/ScratchGame/BUILD)" = "5"
          test -f apps/ScratchGame/RELEASE_NOTES_V0.5.5_BUILD5.md
          if git grep -nE '(ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |OPENSSH |EC |DSA )?PRIVATE KEY-----)' -- . ':!*.md'; then
            echo "Potential secret-like material detected in tracked non-Markdown files."
            exit 1
          fi
          run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ACCEPTANCE_RUN_ID}")"
          test "$(jq -r '.conclusion' <<<"${run_json}")" = "success"
          test "$(jq -r '.head_sha' <<<"${run_json}")" = "${ACCEPTANCE_HEAD_SHA}"

      - name: Download and verify accepted Portable
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o "${ARTIFACT_ARCHIVE}"
          echo "${ARTIFACT_ARCHIVE_SHA256}  ${ARTIFACT_ARCHIVE}" | sha256sum -c -
          mkdir -p release-dist
          unzip -q "${ARTIFACT_ARCHIVE}" -d release-dist
          test -f "release-dist/${RELEASE_ZIP}"
          test "$(stat -c '%s' "release-dist/${RELEASE_ZIP}")" = "${RELEASE_ZIP_SIZE}"
          echo "${RELEASE_ZIP_SHA256}  release-dist/${RELEASE_ZIP}" | sha256sum -c -
          unzip -l "release-dist/${RELEASE_ZIP}" | grep -F 'ScratchGame/ScratchGame.exe'
          unzip -l "release-dist/${RELEASE_ZIP}" | grep -F 'ScratchGame/PackEditor.exe'
          unzip -l "release-dist/${RELEASE_ZIP}" | grep -F 'ScratchGame/PACKAGE_CONTENTS.txt'
          unzip -l "release-dist/${RELEASE_ZIP}" | grep -F 'ScratchGame/TestPacks/ThreeStar-Test.scratchpack'
          printf '%s  %s\n' "${RELEASE_ZIP_SHA256}" "${RELEASE_ZIP}" > release-dist/SHA256SUMS.txt

      - name: Verify real tag and published release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          test "$(jq -r '.object.type' <<<"${tag_json}")" = "commit"
          test "$(jq -r '.object.sha' <<<"${tag_json}")" = "${TARGET_SHA}"

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          test "$(jq -r '.draft' <<<"${release_json}")" = "false"
          test -n "$(jq -r '.published_at // empty' <<<"${release_json}")"

      - name: Upload formal Release assets with GitHub CLI
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 180 gh release upload "${TAG}" \
            "release-dist/SHA256SUMS.txt" \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"

          timeout 1200 gh release upload "${TAG}" \
            "release-dist/${RELEASE_ZIP}" \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"

      - name: Verify published Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          test "$(jq -r '.object.sha' <<<"${tag_json}")" = "${TARGET_SHA}"

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          release_id="$(jq -r '.id' <<<"${release_json}")"
          test "$(jq -r '.draft' <<<"${release_json}")" = "false"
          test -n "$(jq -r '.published_at // empty' <<<"${release_json}")"

          assets_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${release_id}/assets?per_page=100")"
          zip_state="$(jq -r --arg n "${RELEASE_ZIP}" '[.[] | select(.name == $n)][0].state // empty' <<<"${assets_json}")"
          zip_size="$(jq -r --arg n "${RELEASE_ZIP}" '[.[] | select(.name == $n)][0].size // 0' <<<"${assets_json}")"
          zip_digest="$(jq -r --arg n "${RELEASE_ZIP}" '[.[] | select(.name == $n)][0].digest // empty' <<<"${assets_json}")"
          sums_state="$(jq -r '[.[] | select(.name == "SHA256SUMS.txt")][0].state // empty' <<<"${assets_json}")"
          test "${zip_state}" = "uploaded"
          test "${zip_size}" = "${RELEASE_ZIP_SIZE}"
          if [ -n "${zip_digest}" ] && [ "${zip_digest}" != "null" ]; then
            test "${zip_digest}" = "sha256:${RELEASE_ZIP_SHA256}"
          fi
          test "${sums_state}" = "uploaded"
          echo "Release ${TAG} is published with verified assets."
