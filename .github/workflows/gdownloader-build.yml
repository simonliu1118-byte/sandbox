name: GDownloader Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'apps/GDownloader/src/**'
      - 'apps/GDownloader/VERSION'
      - 'apps/GDownloader/BUILD'
      - '.github/workflows/gdownloader-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gdownloader-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version
        id: version
        run: |
          $version = (Get-Content 'apps/GDownloader/VERSION' -Raw).Trim()
          $build = (Get-Content 'apps/GDownloader/BUILD' -Raw).Trim()
          "version=$version" >> $env:GITHUB_OUTPUT
          "build=$build" >> $env:GITHUB_OUTPUT
          if ($build -eq '0') {
            "display=V$version" >> $env:GITHUB_OUTPUT
            "slug=V$version" >> $env:GITHUB_OUTPUT
          } else {
            "display=V$version Build $build" >> $env:GITHUB_OUTPUT
            "slug=V$version-Build$build" >> $env:GITHUB_OUTPUT
          }

      - name: Restore
        run: dotnet restore apps/GDownloader/src/GDownloader/GDownloader.csproj

      - name: Build
        run: dotnet build apps/GDownloader/src/GDownloader/GDownloader.csproj -c Release --no-restore

      - name: Publish portable folder
        run: |
          dotnet publish apps/GDownloader/src/GDownloader/GDownloader.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=false `
            --no-restore `
            -o publish/GDownloader

      - name: Package artifact
        run: |
          Compress-Archive -Path 'publish/GDownloader/*' -DestinationPath "GDownloader-${{ steps.version.outputs.slug }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: GDownloader-${{ steps.version.outputs.slug }}
          path: GDownloader-${{ steps.version.outputs.slug }}.zip
          retention-days: 14
