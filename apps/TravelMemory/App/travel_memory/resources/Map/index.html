<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>旅行記憶地圖</title>
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css" />
  <style>
    html,body,#map,#fallback{margin:0;width:100%;height:100%;overflow:hidden}
    body{font-family:"Microsoft JhengHei","Segoe UI",sans-serif;background:#dce8ed}
    #map{display:none}
    #fallback{position:relative;background:#dce8ed;cursor:grab}
    #world{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.92}
    #fallbackTracks{position:absolute;inset:0;width:100%;height:100%}
    #fallbackTracks polyline{pointer-events:stroke;cursor:pointer}
    #badge{position:absolute;left:12px;bottom:12px;padding:6px 9px;background:rgba(255,255,255,.92);border:1px solid #c4ccd1;border-radius:4px;font-size:13px}
    .tm-control-button{display:flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0;border:0;background:#fff;color:#333;cursor:pointer}
    .tm-control-button+ .tm-control-button{border-top:1px solid #ddd}
    .tm-control-button:hover{background:#f3f3f3}
    .tm-control-button svg{width:21px;height:21px;display:block}
    .maplibregl-ctrl-scale{font-family:"Microsoft JhengHei","Segoe UI",sans-serif;background:rgba(255,255,255,.9);border-color:#333;color:#222}
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="fallback">
    <img id="world" src="world.svg" alt="本機簡易地圖" draggable="false" />
    <svg id="fallbackTracks" viewBox="0 0 2000 1000" preserveAspectRatio="none"></svg>
    <div id="badge">本機簡易地圖</div>
  </div>
  <script src="qrc:///qtwebchannel/qwebchannel.js"></script>
  <script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
  <script>
    let bridge=null, map=null, provider='auto', selectedTrackId=null, generation=0, recoveryTimer=null;
    let payload={tracks:[],gapSeconds:120,showPoints:true,showEndpoints:true,showSegmentConnectors:true,lineWidth:2.4,pointSize:3,fit:true};
    const mapDiv=document.getElementById('map'), fallback=document.getElementById('fallback');
    const fallbackTracks=document.getElementById('fallbackTracks'), badge=document.getElementById('badge');
    const send=(method,...args)=>{try{if(bridge&&typeof bridge[method]==='function')bridge[method](...args)}catch(e){console.warn(e)}};
    new QWebChannel(qt.webChannelTransport, channel=>{bridge=channel.objects.bridge;send('mapStatus','ready','本機簡易地圖')});

    function useFallback(label='本機簡易地圖'){
      if(map){map.remove();map=null}
      mapDiv.style.display='none';fallback.style.display='block';badge.textContent=label;
      drawFallback();send('mapStatus','fallback',label);
      if(recoveryTimer){clearInterval(recoveryTimer);recoveryTimer=null}
      if(!label.includes('手動')){
        recoveryTimer=setInterval(async()=>{
          try{await fetch('https://tiles.openfreemap.org/styles/liberty?health='+Date.now(),{cache:'no-store',mode:'no-cors'});clearInterval(recoveryTimer);recoveryTimer=null;send('onlineRestored')}catch(_){ }
        },30000);
      }
    }
    function styleFor(name){
      if(name==='osm') return {version:8,sources:{osm:{type:'raster',tiles:['https://tile.openstreetmap.org/{z}/{x}/{y}.png'],tileSize:256,attribution:'© OpenStreetMap contributors'}},layers:[{id:'osm',type:'raster',source:'osm'}]};
      return 'https://tiles.openfreemap.org/styles/liberty';
    }
    function createMap(name='openfreemap',allowFallback=true){
      if(!window.maplibregl){useFallback();return}
      const gen=++generation;mapDiv.style.display='block';fallback.style.display='none';
      send('mapStatus','loading',name==='osm'?'OpenStreetMap':'OpenFreeMap');
      if(map)map.remove();
      map=new maplibregl.Map({container:'map',style:styleFor(name),center:[139,36],zoom:4,attributionControl:true});
      addMapControls();
      let loaded=false;
      const timer=setTimeout(()=>{if(!loaded&&gen===generation){if(name==='openfreemap'&&allowFallback)createMap('osm',false);else useFallback()}},10000);
      map.once('load',()=>{if(gen!==generation)return;loaded=true;clearTimeout(timer);if(recoveryTimer){clearInterval(recoveryTimer);recoveryTimer=null}addLayers();renderOnline();send('mapStatus','online',name==='osm'?'OpenStreetMap':'OpenFreeMap')});
      map.on('error',e=>console.warn(e?.error||e));
    }
    function setProvider(name){provider=['auto','openfreemap','osm','fallback'].includes(name)?name:'auto';if(provider==='fallback')useFallback('本機簡易地圖（手動）');else createMap(provider==='osm'?'osm':'openfreemap',provider==='auto')}

    function controlButton(title,svg,onClick){
      const button=document.createElement('button');button.type='button';button.className='tm-control-button';
      button.title=title;button.setAttribute('aria-label',title);button.innerHTML=svg;button.addEventListener('click',onClick);return button;
    }
    function controlGroup(buttons){
      const element=document.createElement('div');element.className='maplibregl-ctrl maplibregl-ctrl-group';buttons.forEach(button=>element.appendChild(button));
      return {onAdd(){return element},onRemove(){element.remove()}};
    }
    function fitAllTracks(){payload.fit=true;if(map)renderOnline();else drawFallback()}
    function addMapControls(){
      const northIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 17 12 12 10 7 12Z" fill="#d93025"/><path d="M12 22 7 12 12 14 17 12Z" fill="#777"/><text x="12" y="9.3" text-anchor="middle" font-size="5.2" font-weight="700" fill="#fff">N</text></svg>';
      const fitIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 12h8M12 8v8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" opacity=".75"/></svg>';
      const plusIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M12 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
      const minusIcon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
      map.addControl(controlGroup([
        controlButton('重置地圖為北方朝上',northIcon,()=>map.easeTo({bearing:0,pitch:0,duration:300})),
        controlButton('顯示全部軌跡',fitIcon,fitAllTracks),
      ]),'top-right');
      map.addControl(controlGroup([
        controlButton('放大',plusIcon,()=>map.zoomIn()),
        controlButton('縮小',minusIcon,()=>map.zoomOut()),
      ]),'top-right');
      const scale=new maplibregl.ScaleControl({maxWidth:120,unit:'metric'});map.addControl(scale,'bottom-right');
      const scaleElement=scale._container;if(scaleElement){scaleElement.title='地圖比例尺';scaleElement.setAttribute('aria-label','地圖比例尺')}
    }

    function createFlagImage(size=32){
      const canvas=document.createElement('canvas');canvas.width=size;canvas.height=size;
      const ctx=canvas.getContext('2d');ctx.clearRect(0,0,size,size);ctx.strokeStyle='#111';ctx.lineWidth=2;
      ctx.beginPath();ctx.moveTo(8,28);ctx.lineTo(8,4);ctx.stroke();ctx.fillStyle='#fff';
      ctx.beginPath();ctx.moveTo(9,5);ctx.lineTo(27,10);ctx.lineTo(9,17);ctx.closePath();ctx.fill();ctx.stroke();
      return ctx.getImageData(0,0,size,size);
    }
    function addLayers(){
      if(!map||!map.isStyleLoaded())return;
      if(!map.hasImage('start-flag'))map.addImage('start-flag',createFlagImage(),{pixelRatio:2});
      if(!map.getSource('lines'))map.addSource('lines',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
      if(!map.getSource('points'))map.addSource('points',{type:'geojson',data:{type:'FeatureCollection',features:[]}});
      map.addLayer({id:'highlight',type:'line',source:'lines',filter:['all',['==',['get','trackId'],-1],['==',['get','kind'],'solid']],paint:{'line-color':'#fff','line-width':payload.lineWidth+5,'line-opacity':.9}});
      map.addLayer({id:'solid',type:'line',source:'lines',filter:['==',['get','kind'],'solid'],paint:{'line-color':['get','color'],'line-width':payload.lineWidth,'line-opacity':.95}});
      map.addLayer({id:'dash',type:'line',source:'lines',filter:['!=',['get','kind'],'solid'],paint:{'line-color':['get','color'],'line-width':Math.max(1,payload.lineWidth*.75),'line-dasharray':[2,2],'line-opacity':.8}});
      map.addLayer({id:'normal-points',type:'circle',source:'points',filter:['==',['get','kind'],'point'],paint:{'circle-radius':payload.pointSize,'circle-color':['get','color'],'circle-stroke-color':'#fff','circle-stroke-width':.7}});
      map.addLayer({id:'start-points',type:'symbol',source:'points',filter:['==',['get','kind'],'start'],layout:{'icon-image':'start-flag','icon-size':1.05,'icon-anchor':'bottom-left','icon-allow-overlap':true}});
      map.addLayer({id:'end-points',type:'circle',source:'points',filter:['==',['get','kind'],'end'],paint:{'circle-radius':payload.pointSize,'circle-color':['get','color'],'circle-stroke-color':'#fff','circle-stroke-width':.7}});
      ['solid','dash','normal-points','start-points','end-points'].forEach(layer=>map.on('click',layer,e=>{const id=e.features?.[0]?.properties?.trackId;if(id!=null){selectedTrackId=Number(id);updateHighlight();send('trackSelected',selectedTrackId)}}));
    }
    function buildGeoJson(){
      const lines=[],points=[];let bounds=null;const priorByDate={};
      const extend=c=>{if(!bounds)bounds=[...c,...c];else{bounds[0]=Math.min(bounds[0],c[0]);bounds[1]=Math.min(bounds[1],c[1]);bounds[2]=Math.max(bounds[2],c[0]);bounds[3]=Math.max(bounds[3],c[1])}};
      for(const track of payload.tracks||[]){
        let priorEnd=null;const dateKey=track.date||'';
        const firstSegment=(track.segments||[]).find(s=>(s.points||[]).length);
        const firstPoint=firstSegment?.points?.[0];
        if(dateKey&&firstPoint&&priorByDate[dateKey]&&payload.showSegmentConnectors){
          lines.push(feature(track,'connector',[[priorByDate[dateKey].lon,priorByDate[dateKey].lat],[firstPoint.lon,firstPoint.lat]]));
        }
        for(const segment of track.segments||[]){
          const ps=segment.points||[];if(!ps.length)continue;
          if(priorEnd&&payload.showSegmentConnectors)lines.push({type:'Feature',properties:{trackId:track.id,color:track.color,kind:'connector'},geometry:{type:'LineString',coordinates:[[priorEnd.lon,priorEnd.lat],[ps[0].lon,ps[0].lat]]}});
          let solid=[[ps[0].lon,ps[0].lat]];extend(solid[0]);
          for(let i=1;i<ps.length;i++){
            const a=ps[i-1],b=ps[i],coord=[b.lon,b.lat];extend(coord);
            const gap=b.gap_before===true||(b.gap_before==null&&a.utc&&b.utc&&((new Date(b.utc)-new Date(a.utc))/1000>payload.gapSeconds));
            if(gap){if(solid.length>1)lines.push(feature(track,'solid',solid));lines.push(feature(track,'gap',[[a.lon,a.lat],coord]));solid=[coord]}else solid.push(coord);
          }
          if(solid.length>1)lines.push(feature(track,'solid',solid));
          ps.forEach((p,i)=>{let kind='point';if(payload.showEndpoints&&i===0)kind='start';else if(payload.showEndpoints&&i===ps.length-1)kind='end';if(kind==='point'&&!payload.showPoints)return;points.push({type:'Feature',properties:{trackId:track.id,color:track.color,kind},geometry:{type:'Point',coordinates:[p.lon,p.lat]}})});
          priorEnd=ps[ps.length-1];
        }
        if(dateKey&&priorEnd)priorByDate[dateKey]=priorEnd;
      }
      return {lines:{type:'FeatureCollection',features:lines},points:{type:'FeatureCollection',features:points},bounds};
    }
    function feature(track,kind,coords){return{type:'Feature',properties:{trackId:track.id,color:track.color,kind},geometry:{type:'LineString',coordinates:coords}}}
    function renderOnline(){if(!map||!map.isStyleLoaded())return;const data=buildGeoJson();map.getSource('lines')?.setData(data.lines);map.getSource('points')?.setData(data.points);updateHighlight();if(payload.fit&&data.bounds)map.fitBounds([[data.bounds[0],data.bounds[1]],[data.bounds[2],data.bounds[3]]],{padding:45,maxZoom:15,duration:0})}
    function updateHighlight(){if(map?.getLayer('highlight'))map.setFilter('highlight',['all',['==',['get','trackId'],selectedTrackId??-1],['==',['get','kind'],'solid']])}
    function project(lon,lat){return[(lon+180)/360*2000,(90-lat)/180*1000]}
    function drawFallback(){
      fallbackTracks.innerHTML='';
      for(const track of payload.tracks||[]){
        for(const segment of track.segments||[]){
          const coords=(segment.points||[]).map(p=>project(p.lon,p.lat).join(',')).join(' ');if(!coords)continue;
          const line=document.createElementNS('http://www.w3.org/2000/svg','polyline');line.setAttribute('points',coords);line.setAttribute('fill','none');line.setAttribute('stroke',track.color||'#2f80ed');line.setAttribute('stroke-width',track.id===selectedTrackId?'5':'2.5');line.setAttribute('vector-effect','non-scaling-stroke');line.addEventListener('click',()=>{selectedTrackId=track.id;drawFallback();send('trackSelected',track.id)});fallbackTracks.appendChild(line)
        }
      }
    }
    window.tmSetTracks=function(json){payload=typeof json==='string'?JSON.parse(json):json;payload.fit=true;if(map)renderOnline();else drawFallback()};
    window.tmSetOptions=function(json){const opts=typeof json==='string'?JSON.parse(json):json;payload={...payload,...opts};if(map)renderOnline();else drawFallback()};
    window.tmSetProvider=setProvider;
    window.tmSelectTrack=function(id){selectedTrackId=id==null?null:Number(id);if(map)updateHighlight();else drawFallback()};
    window.tmHealth=function(){return {ready:true,provider,mapLoaded:!!map,trackCount:(payload.tracks||[]).length}};
    window.tmShutdown=function(){generation++;if(recoveryTimer){clearInterval(recoveryTimer);recoveryTimer=null}if(map){try{map.remove()}catch(_){ }map=null}payload={tracks:[]};bridge=null;return true};
    setTimeout(()=>setProvider('auto'),0);
  </script>
</body>
</html>
